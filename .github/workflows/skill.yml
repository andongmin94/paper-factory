name: Skill tools

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Test PR heads once, rather than both branch pushes and PR merge refs.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install document and test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Check standalone scripts
        run: python -m compileall -q scripts
      - name: Verify installed Pandoc identity
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from _publication_convert import pandoc_binary, pandoc_version; print(pandoc_version(pandoc_binary()))"
      - name: Run isolated tool tests
        run: python -m pytest -q
      - name: Package the portable skill
        run: git archive --format=zip --prefix=paper-factory/ --output=paper-factory.zip HEAD SKILL.md LICENSE requirements.txt scripts references assets
      - name: Upload the installable skill archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-factory-skill
          path: paper-factory.zip
          if-no-files-found: error
