name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and restore cache
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          build-warnings: ""

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config \
            libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libvulkan1

      - name: Check formatting and lint
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Test file handling
        run: cargo test --locked

      - name: Build the app
        run: cargo build --locked
