name: Standalone desktop build

on:
  push:
    paths: ['desktop/**', 'src/**', 'pyproject.toml', '.github/workflows/desktop.yml', 'LICENSE']
  pull_request:
    paths: ['desktop/**', 'src/**', 'pyproject.toml', '.github/workflows/desktop.yml', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked development dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and run synthetic controller and SDK tests
        run: npm test
      # Native runtime probes and static package inspection do not use account credentials.
      # Actual installed OAuth and research remain separate verification gates.
      - name: Build pinned native runtime, installer and inspect every payload member
        run: npm run package:app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify hidden Chromium boundaries with the inspected bundled Python
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testRuntime = (Resolve-Path 'runtime/win32-x64').Path
          $testInventory = Get-Content -LiteralPath (Join-Path $testRuntime 'runtime-inventory.json') -Raw | ConvertFrom-Json
          $env:PF_CHROMIUM_TEST_PYTHON = Join-Path $testRuntime $testInventory.executables.python
          npm run test:chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-static-verification-${{ matrix.os }}
          path: |
            desktop/release/standalone-package-verification.json
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: error
